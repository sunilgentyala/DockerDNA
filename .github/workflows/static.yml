name: Deploy Static Content to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Tree
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Setup GitHub Pages Environment Node
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d  # v6.0.0

      # Copy the published page plus the assets it references (thumbnail.png for
      # Open Graph/Twitter cards, favicon.svg) into a fresh deployment target folder.
      - name: Stage Web Production Artifact
        run: |
          mkdir public
          cp index.html public/
          cp thumbnail.png public/
          cp favicon.svg public/

      - name: Upload Static Web Production Artifacts
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa  # v3
        with:
          # Target only the clean public folder containing your standalone page
          path: 'public'

      - name: Deploy to GitHub Pages Edge
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346  # v5.0.1
