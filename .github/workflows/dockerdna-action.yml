name: DockerDNA Security Gate

# Reusable workflow: add to any project to run DockerDNA as a PR security gate
on:
  workflow_call:
    inputs:
      dockerfile:
        description: "Path to Dockerfile"
        required: false
        default: "Dockerfile"
        type: string
      compose_file:
        description: "Path to docker-compose.yml"
        required: false
        default: ""
        type: string
      threshold:
        description: "Fail build if findings at this severity or above (CRITICAL/HIGH/MEDIUM/LOW)"
        required: false
        default: "HIGH"
        type: string
      version:
        description: "DockerDNA version to install (pinned for reproducibility)"
        required: false
        default: "1.1.0"
        type: string
      formats:
        description: "Output formats (space-separated: json html sarif sbom)"
        required: false
        default: "json sarif"
        type: string

jobs:
  dockerdna-scan:
    name: DockerDNA Security Scan
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"

      - name: Install DockerDNA
        run: pip install "dockerdna==${DD_VERSION}"
        env:
          DD_VERSION: ${{ inputs.version }}

      - name: Run DockerDNA scan
        id: scan
        # NOTE: do not swallow the exit code here (e.g. with `|| echo ...`).
        # dockerdna exits 1 when --threshold is exceeded specifically so this
        # step, and therefore the job, fails and blocks the PR. The upload
        # steps below use `if: always()` so reports still get published even
        # when the scan step fails the job.
        # Inputs are passed through env, never interpolated into the script, so a
        # caller-controlled value cannot inject shell commands.
        env:
          DD_DOCKERFILE: ${{ inputs.dockerfile }}
          DD_COMPOSE: ${{ inputs.compose_file }}
          DD_THRESHOLD: ${{ inputs.threshold }}
          DD_FORMATS: ${{ inputs.formats }}
        run: |
          case "$DD_THRESHOLD" in CRITICAL|HIGH|MEDIUM|LOW) ;; *) echo "invalid threshold" >&2; exit 2 ;; esac
          read -r -a FORMATS <<< "$DD_FORMATS"
          for f in "${FORMATS[@]}"; do
            case "$f" in json|html|sarif|sbom) ;; *) echo "invalid format: $f" >&2; exit 2 ;; esac
          done
          ARGS=("$DD_DOCKERFILE" --format "${FORMATS[@]}" --threshold "$DD_THRESHOLD" --strict --output dockerdna-results)
          if [ -n "$DD_COMPOSE" ]; then
            ARGS+=(--compose "$DD_COMPOSE")
          fi
          dockerdna "${ARGS[@]}"

      - name: Upload SARIF results
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370  # v4
        if: always() && contains(inputs.formats, 'sarif') && hashFiles('dockerdna-results/report.sarif') != ''
        with:
          sarif_file: dockerdna-results/report.sarif

      - name: Upload scan report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        if: always()
        with:
          name: dockerdna-security-report
          path: dockerdna-results/
          retention-days: 30
